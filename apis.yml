name: CatalYm
description: CatalYm GmbH is a clinical-stage biotechnology company based in Planegg-Martinsried
  near Munich, Germany, developing next-generation cancer immunotherapies. Its lead approach
  neutralizes GDF-15 (Growth Differentiation Factor 15) to reverse a key immune-resistance
  mechanism in solid tumors, aiming to reinstate anti-tumor immune activity and overcome
  resistance to checkpoint-inhibitor and other cancer therapies. The company is a portfolio
  company of Canaan Partners. This is a biotech/pharmaceutical organization with no public
  developer API, SDK, or documentation surface; it is tracked in the API Evangelist network
  as a company profile rather than an API provider.
